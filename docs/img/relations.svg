<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
<title id="t">Trzy relacje między reklamami</title>
<desc id="d">Ta sama kampania, ten sam operator oraz tylko podobne, z warunkami każdej relacji.</desc>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="1280" height="400" rx="20" fill="#0B1120"/><g transform="translate(20 0)">
<rect x="48" y="40" width="360" height="320" rx="18" fill="#10203A" stroke="#33D9BC" stroke-width="1.6"/><circle cx="108" cy="108" r="22" fill="#33D9BC" stroke="#33D9BC" stroke-width="3"/><circle cx="178" cy="108" r="22" fill="#33D9BC" stroke="#33D9BC" stroke-width="3"/><line x1="130" y1="108" x2="156" y2="108" stroke="#33D9BC" stroke-width="4"/><text x="72" y="176" font-size="24" font-weight="800" fill="#33D9BC">ta sama kampania</text><text x="72" y="200" font-size="13" fill="#7F90B3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">same_campaign</text><text x="72" y="236" font-size="15.5" font-weight="700" fill="#fff">Wspólne źródło i ta sama opowieść.</text><text x="72" y="266" font-size="14" fill="#B7C4DE">Rzadki marker rozstrzygający albo dwa niezależne</text><text x="72" y="288" font-size="14" fill="#B7C4DE">potwierdzenia (jedno z zaplecza) oraz zgodna treść,</text><text x="72" y="310" font-size="14" fill="#B7C4DE">obrazy albo kontakt.</text><rect x="440" y="40" width="360" height="320" rx="18" fill="#10203A" stroke="#647BFF" stroke-width="1.6"/><circle cx="500" cy="108" r="22" fill="#647BFF" stroke="#647BFF" stroke-width="3"/><circle cx="570" cy="108" r="22" fill="#647BFF" stroke="#647BFF" stroke-width="3"/><line x1="522" y1="108" x2="548" y2="108" stroke="#647BFF" stroke-width="4"/><circle cx="640" cy="108" r="22" fill="#647BFF" fill-opacity="0.35" stroke="#647BFF" stroke-width="3"/><line x1="592" y1="108" x2="618" y2="108" stroke="#647BFF" stroke-width="4"/><text x="464" y="176" font-size="24" font-weight="800" fill="#647BFF">ten sam operator</text><text x="464" y="200" font-size="13" fill="#7F90B3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">same_operator</text><text x="464" y="236" font-size="15.5" font-weight="700" fill="#fff">Wspólne źródło, inna opowieść.</text><text x="464" y="266" font-size="14" fill="#B7C4DE">Ten sam ślad konta lub infrastruktury (panel lejka,</text><text x="464" y="288" font-size="14" fill="#B7C4DE">piksel, konto reklamowe, certyfikat), ale inny</text><text x="464" y="310" font-size="14" fill="#B7C4DE">artykuł, inna twarz, inna domena.</text><rect x="832" y="40" width="360" height="320" rx="18" fill="#10203A" stroke="#FFC15A" stroke-width="1.6"/><circle cx="892" cy="108" r="22" fill="none" stroke="#FFC15A" stroke-width="3"/><circle cx="962" cy="108" r="22" fill="none" stroke="#FFC15A" stroke-width="3"/><line x1="914" y1="108" x2="940" y2="108" stroke="#FFC15A" stroke-width="3" stroke-dasharray="6 5"/><text x="856" y="176" font-size="24" font-weight="800" fill="#FFC15A">tylko podobne</text><text x="856" y="200" font-size="13" fill="#7F90B3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">similar</text><text x="856" y="236" font-size="15.5" font-weight="700" fill="#fff">Podobna koncepcja, bez dowodu źródła.</text><text x="856" y="266" font-size="14" fill="#B7C4DE">Skopiowany artykuł, ta sama kreacja, wspólne motywy</text><text x="856" y="288" font-size="14" fill="#B7C4DE">albo ten sam silnik lejka bez śladu operatora.</text><text x="856" y="310" font-size="14" fill="#B7C4DE">Nigdy nie scala grup.</text></g></g></svg>