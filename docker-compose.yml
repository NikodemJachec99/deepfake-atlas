x-backend: &backend
  build: ./backend
  image: deepfake-atlas-backend  # backend i worker dzielą jeden obraz
  env_file: .env
  volumes: ["./backend:/app", "./data:/data"]
  depends_on:
    db: {condition: service_healthy}

services:
  db:
    image: pgvector/pgvector:pg16
    env_file: .env
    ports: ["${DB_PORT:-5432}:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  temporal:
    image: temporalio/temporal:latest
    user: "0:0"  # serwer deweloperski zapisuje historię do pliku SQLite na wolumenie
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports: ["${TEMPORAL_PORT:-7233}:7233", "${TEMPORAL_UI_PORT:-8233}:8233"]
    volumes: [temporaldata:/data]

  # Magazyn dowodów zgodny z S3. MinIO przestało publikować obrazy, stąd RustFS (Apache-2.0).
  s3:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: scamdna
      RUSTFS_SECRET_KEY: scamdna-secret
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["${S3_PORT:-9000}:9000", "${S3_CONSOLE_PORT:-9001}:9001"]
    volumes: [s3data:/data]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/scamdna-neo4j
    ports: ["${NEO4J_HTTP_PORT:-7474}:7474", "${NEO4J_BOLT_PORT:-7687}:7687"]
    volumes: [neo4jdata:/data]

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["${OPENSEARCH_PORT:-9200}:9200"]
    volumes: [osdata:/usr/share/opensearch/data]

  backend:
    <<: *backend
    command: ["sh", "-c", "python manage.py migrate --noinput && uvicorn scamdna.asgi:application --host 0.0.0.0 --port 8000 --reload"]
    ports: ["${BACKEND_PORT:-8000}:8000"]

  worker:
    <<: *backend
    # watchfiles restartuje worker po zmianie kodu. Bez tego worker trzyma w pamięci starą wersję potoku.
    command: ["watchfiles", "--filter", "python", "python -m workflows.worker", "/app"]
    depends_on:
      db: {condition: service_healthy}
      temporal: {condition: service_started}
    networks: [default, crawl]

  # Przeglądarka do stron oszustów (docs/crawler.md). Sieć `crawl` jest wewnętrzna: bez wyjścia na zewnątrz,
  # bez bazy, magazynu dowodów i kolejek. Jedyne wyjście to proxy `crawler-egress`, które wpuszcza
  # wyłącznie adresy publiczne. Z crawlerem rozmawia tylko worker.
  crawler:
    build: ./crawler
    image: deepfake-atlas-crawler
    environment:
      GUARD_PROXY_URL: http://crawler-egress:3128
    networks: [crawl]
    depends_on: [crawler-egress]
    shm_size: 512m
    read_only: true
    tmpfs: ["/tmp", "/home/render"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 512

  crawler-egress:
    image: deepfake-atlas-crawler
    build: ./crawler
    command: ["python", "server.py", "--proxy-only"]
    networks: [crawl, egress]
    healthcheck: {disable: true}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

  frontend:
    build:
      context: ./frontend
      args:
        # Adres API widziany z przeglądarki, wkompilowany w czasie budowania.
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
        # Opcjonalny klucz zapisu, ten sam co API_WRITE_KEY backendu. Pusty: wyłączony.
        NEXT_PUBLIC_API_KEY: ${NEXT_PUBLIC_API_KEY:-}
        # Źródło obrazu Node. Domyślnie lustro ECR; CI przełącza na Docker Hub, gdy ECR odmawia.
        NODE_IMAGE: ${NODE_IMAGE:-public.ecr.aws/docker/library/node:24-alpine}
    ports: ["${FRONTEND_PORT:-3000}:3000"]
    depends_on: [backend]

networks:
  default:
  crawl:
    internal: true
  egress:

volumes:
  dbdata:
  temporaldata:
  s3data:
  neo4jdata:
  osdata:
