<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 470" width="1280" height="470" role="img" aria-labelledby="t d">
<title id="t">Wyniki na danych organizatora (zbiorczo)</title>
<desc id="d">28 stron z 25 spraw, 4 kampanie, 3 grupy operatorów, 14 stron bez operatora. Odporność: bez HAR 18 z 32 połączeń, bez zapisu strony 30 z 32, bez zrzutów 32 z 32, zero nowych fałszywych powiązań, 7 z 7 wariantów próby jury.</desc>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<rect width="1280" height="470" rx="20" fill="#0B1120"/>
<text x="48" y="48" font-size="14" font-weight="700" fill="#7F90B3" letter-spacing="2.5">WYNIKI NA DANYCH ORGANIZATORA (zbiorczo, model fs-5.1, 22.11.2026)</text>
<rect x="48" y="68" width="181" height="118" rx="16" fill="#10203A" stroke="#3D9BE0" stroke-opacity="0.7"/><rect x="48" y="68" width="181" height="5" rx="2.5" fill="#3D9BE0"/><text x="138" y="128" font-size="46" font-weight="800" fill="#3D9BE0" text-anchor="middle">28</text><text x="138" y="162" font-size="13" fill="#C5D1E8" text-anchor="middle">stron z 25 spraw</text><rect x="245" y="68" width="181" height="118" rx="16" fill="#10203A" stroke="#33D9BC" stroke-opacity="0.7"/><rect x="245" y="68" width="181" height="5" rx="2.5" fill="#33D9BC"/><text x="335" y="128" font-size="46" font-weight="800" fill="#33D9BC" text-anchor="middle">4</text><text x="335" y="162" font-size="13" fill="#C5D1E8" text-anchor="middle">kampanie</text><rect x="442" y="68" width="181" height="118" rx="16" fill="#10203A" stroke="#647BFF" stroke-opacity="0.7"/><rect x="442" y="68" width="181" height="5" rx="2.5" fill="#647BFF"/><text x="532" y="128" font-size="46" font-weight="800" fill="#647BFF" text-anchor="middle">3</text><text x="532" y="162" font-size="13" fill="#C5D1E8" text-anchor="middle">grupy operatorów</text><rect x="639" y="68" width="181" height="118" rx="16" fill="#10203A" stroke="#FFC15A" stroke-opacity="0.7"/><rect x="639" y="68" width="181" height="5" rx="2.5" fill="#FFC15A"/><text x="729" y="128" font-size="46" font-weight="800" fill="#FFC15A" text-anchor="middle">14</text><text x="729" y="162" font-size="13" fill="#C5D1E8" text-anchor="middle">stron bez operatora</text><rect x="836" y="68" width="181" height="118" rx="16" fill="#10203A" stroke="#F16C92" stroke-opacity="0.7"/><rect x="836" y="68" width="181" height="5" rx="2.5" fill="#F16C92"/><text x="926" y="128" font-size="46" font-weight="800" fill="#F16C92" text-anchor="middle">0</text><text x="926" y="162" font-size="13" fill="#C5D1E8" text-anchor="middle">nowe fałszywe powiązania</text><rect x="1033" y="68" width="181" height="118" rx="16" fill="#10203A" stroke="#25B48A" stroke-opacity="0.7"/><rect x="1033" y="68" width="181" height="5" rx="2.5" fill="#25B48A"/><text x="1123" y="128" font-size="46" font-weight="800" fill="#25B48A" text-anchor="middle">7/7</text><text x="1123" y="162" font-size="13" fill="#C5D1E8" text-anchor="middle">wariantów próby jury</text><text x="48" y="232" font-size="14" font-weight="700" fill="#7F90B3" letter-spacing="2.5">ODPORNOŚĆ NA BRAK MATERIAŁU: ILE Z 32 POŁĄCZEŃ WSPÓLNEGO ŹRÓDŁA ZOSTAJE</text><text x="48" y="280" font-size="16" font-weight="600" fill="#fff">bez plików HAR</text><rect x="250" y="256" width="560" height="34" rx="17" fill="#10203A"/><rect x="250" y="256" width="315" height="34" rx="17" fill="#EF7A3C"/><text x="549" y="279" font-size="16" font-weight="800" fill="#0B1120" text-anchor="end">18 z 32</text><text x="830" y="279" font-size="13.5" fill="#9FB0CF">identyfikatory panelu lejka i hosty zasobów są tylko w ruchu sieciowym</text><text x="48" y="340" font-size="16" font-weight="600" fill="#fff">bez zapisu strony</text><rect x="250" y="316" width="560" height="34" rx="17" fill="#10203A"/><rect x="250" y="316" width="525" height="34" rx="17" fill="#E0A12B"/><text x="759" y="339" font-size="16" font-weight="800" fill="#0B1120" text-anchor="end">30 z 32</text><text x="830" y="339" font-size="13.5" fill="#9FB0CF">dokument strony jest też w HAR</text><text x="48" y="400" font-size="16" font-weight="600" fill="#fff">bez zrzutów reklam</text><rect x="250" y="376" width="560" height="34" rx="17" fill="#10203A"/><rect x="250" y="376" width="560" height="34" rx="17" fill="#25B48A"/><text x="794" y="399" font-size="16" font-weight="800" fill="#0B1120" text-anchor="end">32 z 32</text><text x="830" y="399" font-size="13.5" fill="#9FB0CF">zrzut reklamy nie rozstrzyga</text><text x="48" y="450" font-size="13.5" fill="#7F90B3">Brak zbioru z oznaczonymi kampaniami, więc nie podajemy precyzji ani czułości. Każdą krawędź między sprawami przejrzano ręcznie po dowodach.</text></g></svg>