name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      db:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: hack, POSTGRES_PASSWORD: hack, POSTGRES_DB: deepfake_atlas}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hack -d deepfake_atlas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://hack:hack@localhost:5432/deepfake_atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Uruchomienie od zera jak w README, na Linuksie: wszystkie kontenery, migracje, import zmyślonej sprawy, interfejs.
  uruchomienie:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      # Rejestry obrazów (Docker Hub, public.ecr.aws) potrafią chwilowo odpowiadać 429. Pobranie i budowanie
      # ponawiamy z rosnącym odstępem, warstwy z udanych prób zostają w cache. Start stosu idzie osobno.
      - name: obrazy (z ponawianiem)
        run: |
          for i in 1 2 3 4; do
            docker compose pull --ignore-buildable --quiet && docker compose build && exit 0
            echo "próba $i nieudana, czekam $((i * 30)) s"
            sleep $((i * 30))
          done
          exit 1
      - run: docker compose up -d
      - name: health
        run: for i in $(seq 1 60); do curl -fsS localhost:8000/health && exit 0; sleep 3; done; exit 1
      - run: docker compose exec -T backend python manage.py seed_people
      - name: import zmyślonej sprawy (Postgres, S3)
        run: docker compose exec -T backend python manage.py shell -c "exec(open('tests/smoke_compose.py', encoding='utf-8').read())"
      - name: API i interfejs
        run: |
          curl -fsS localhost:8000/api/stats
          for i in $(seq 1 30); do curl -fsS -o /dev/null localhost:3000/ && exit 0; sleep 2; done; exit 1
      - name: logi przy błędzie
        if: failure()
        run: docker compose logs --tail 80
      - if: always()
        run: docker compose down -v

